<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agrinho: Agro Forte, Futuro Sustentável</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2c3e50;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            user-select: none;
        }

        h1 {
            margin: 10px 0 5px 0;
            font-size: 24px;
            color: #2ecc71;
            text-shadow: 2px 2px #27ae60;
        }

        #ui-top {
            display: flex;
            gap: 20px;
            margin-bottom: 10px;
            font-size: 18px;
            background: rgba(0,0,0,0.5);
            padding: 8px 20px;
            border-radius: 20px;
        }

        #shop {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            background: #34495e;
            padding: 10px;
            border-radius: 10px;
            border: 2px solid #2ecc71;
        }

        .seed-card {
            width: 80px;
            height: 90px;
            background: #2c3e50;
            border: 2px solid #bdc3c7;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            text-align: center;
        }

        .seed-card.selected {
            border-color: #f1c40f;
            background: #16a085;
        }

        .seed-icon {
            font-size: 28px;
            margin-bottom: 5px;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 400px;
            background: #27ae60; /* Cor do campo/gramado */
            border: 4px solid #27ae60;
            border-radius: 5px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        /* Linhas do tabuleiro */
        .grid-line {
            position: absolute;
            width: 100%;
            height: 1px;
            background: rgba(255,255,255,0.1);
        }
        .grid-col {
            position: absolute;
            height: 100%;
            width: 1px;
            background: rgba(255,255,255,0.1);
        }

        /* Entidades do Jogo */
        .entity {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            transition: transform 0.1s;
        }

        .projectile {
            position: absolute;
            font-size: 20px;
        }

        .sun-resource {
            position: absolute;
            font-size: 30px;
            cursor: pointer;
            animation: bounce 1s infinite alternate;
            z-index: 10;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-5px); }
        }

        #game-over-screen {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        #btn-restart {
            padding: 10px 20px;
            font-size: 18px;
            background: #2ecc71;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }
        #btn-restart:hover { background: #27ae60; }
    </style>
</head>
<body>

    <h1>EcoDefensores do Agro</h1>
    <p style="margin: 0 0 10px 0; font-size: 14px; color: #bdc3c7;">Equilibre a produção e proteja a sustentabilidade do campo!</p>

    <div id="ui-top">
        <div>BioPontos (Sol): <span id="sun-count">150</span> ☀️</div>
        <div>Pontuação: <span id="score-count">0</span></div>
    </div>

    <div id="shop">
        <div class="seed-card" onclick="selectPlant('sunflower', 50)" id="card-sunflower">
            <span class="seed-icon">🌻</span>
            <span>Painel Solar</span>
            <small>50 ☀️</small>
        </div>
        <div class="seed-card" onclick="selectPlant('peashooter', 100)" id="card-peashooter">
            <span class="seed-icon">🌱</span>
            <span>BioDisparador</span>
            <small>100 ☀️</small>
        </div>
        <div class="seed-card" onclick="selectPlant('wallnut', 50)" id="card-wallnut">
            <span class="seed-icon">🌳</span>
            <span>Reflorestamento</span>
            <small>50 ☀️</small>
        </div>
    </div>

    <div id="game-container" onclick="handleGridClick(event)">
        <div id="game-over-screen">
            <h2 style="color: #e74c3c; font-size: 40px; margin: 0;">Fim de Jogo!</h2>
            <p>O desequilíbrio ambiental tomou conta da fazenda.</p>
            <button id="btn-restart" onclick="restartGame()">Tentar Novamente</button>
        </div>
    </div>

    <script>
        const container = document.getElementById('game-container');
        const sunCountEl = document.getElementById('sun-count');
        const scoreCountEl = document.getElementById('score-count');

        // Configurações da Grade
        const rows = 5;
        const cols = 9;
        const cellWidth = 800 / cols; // ~88.8px
        const cellHeight = 400 / rows; // 80px

        // Estado do Jogo
        let suns = 150;
        let score = 0;
        let selectedPlantType = null;
        let selectedPlantCost = 0;
        let gameActive = true;

        let plants = [];
        let enemies = [];
        let projectiles = [];

        // Timers do Jogo
        let gameLoopInterval;
        let enemySpawnInterval;
        let passiveSunInterval;

        // Criar linhas visuais no tabuleiro
        for(let i=1; i<rows; i++) {
            let line = document.createElement('div'); line.className = 'grid-line'; line.style.top = (i * cellHeight) + 'px'; container.appendChild(line);
        }
        for(let i=1; i<cols; i++) {
            let col = document.createElement('div'); col.className = 'grid-col'; col.style.left = (i * cellWidth) + 'px'; container.appendChild(col);
        }

        function updateUI() {
            sunCountEl.innerText = suns;
            scoreCountEl.innerText = score;
        }

        function selectPlant(type, cost) {
            if (!gameActive) return;
            // Remover seleção anterior
            document.querySelectorAll('.seed-card').forEach(c => c.classList.remove('selected'));
            
            if (suns >= cost) {
                selectedPlantType = type;
                selectedPlantCost = cost;
                document.getElementById(`card-${type}`).classList.add('selected');
            } else {
                alert("BioPontos insuficientes!");
            }
        }

        function handleGridClick(e) {
            if (!gameActive || !selectedPlantType) return;

            // Identificar em qual célula o jogador clicou
            const rect = container.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            const gridX = Math.floor(clickX / cellWidth);
            const gridY = Math.floor(clickY / cellHeight);

            // Verificar se já existe planta no local
            const cellOccupied = plants.some(p => p.gridX === gridX && p.gridY === gridY);

            if (!cellOccupied && suns >= selectedPlantCost) {
                suns -= selectedPlantCost;
                createPlant(selectedPlantType, gridX, gridY);
                // Limpar seleção
                selectedPlantType = null;
                selectedPlantCost = 0;
                document.querySelectorAll('.seed-card').forEach(c => c.classList.remove('selected'));
                updateUI();
            }
        }

        function createPlant(type, x, y) {
            const plantEl = document.createElement('div');
            plantEl.className = 'entity';
            plantEl.style.width = cellWidth + 'px';
            plantEl.style.height = cellHeight + 'px';
            plantEl.style.left = (x * cellWidth) + 'px';
            plantEl.style.top = (y * cellHeight) + 'px';

            let hp = 100;
            let icon = '🌱';

            if (type === 'sunflower') { icon = '🌻'; hp = 80; }
            if (type === 'peashooter') { icon = '🌱'; hp = 100; }
            if (type === 'wallnut') { icon = '🌳'; hp = 300; } // Árvore nativa aguenta mais dano

            plantEl.innerText = icon;
            container.appendChild(plantEl);

            plants.push({
                el: plantEl, type: type, gridX: x, gridY: y,
                hp: hp, maxHp: hp,
                lastAction: Date.now()
            });
        }

        function spawnEnemy() {
            if (!gameActive) return;
            const randomRow = Math.floor(Math.random() * rows);
            const enemyEl = document.createElement('div');
            enemyEl.className = 'entity';
            enemyEl.style.width = cellWidth + 'px';
            enemyEl.style.height = cellHeight + 'px';
            enemyEl.style.left = '800px'; // Começa fora da tela à direita
            enemyEl.style.top = (randomRow * cellHeight) + 'px';

            // Alternar entre lagarta devoradora e nuvem de fumaça poluente
            const isPollution = Math.random() > 0.5;
            enemyEl.innerText = isPollution ? '💨' : '🐛';

            container.appendChild(enemyEl);

            enemies.push({
                el: enemyEl,
                x: 800,
                gridY: randomRow,
                hp: 100,
                speed: isPollution ? 0.8 : 0.5, // Fumaça é mais rápida
                damage: 1
            });
        }

        function spawnPassiveSun() {
            if (!gameActive) return;
            // Só gera sol se o jogador clicar, simulando energia solar caindo do céu
            createSunElement(Math.random() * 700 + 50, Math.random() * 250 + 50);
        }

        function createSunElement(x, y) {
            const sunEl = document.createElement('div');
            sunEl.className = 'sun-resource';
            sunEl.innerText = '☀️';
            sunEl.style.left = x + 'px';
            sunEl.style.top = y + 'px';
            
            sunEl.onclick = (e) => {
                e.stopPropagation(); // Não planta ao coletar sol
                suns += 25;
                updateUI();
                sunEl.remove();
            };
            container.appendChild(sunEl);

            // Sumir após 7 segundos se não coletado
            setTimeout(() => { if(sunEl.parentNode) sunEl.remove(); }, 7000);
        }

        // LOOP PRINCIPAL DO JOGO (Roda a cada ~30ms)
        function gameLoop() {
            if (!gameActive) return;

            // 1. Mover e Atualizar Inimigos
            enemies.forEach((enemy, eIdx) => {
                // Verificar se há uma planta na mesma linha impedindo a passagem
                const targetPlant = plants.find(p => p.gridY === enemy.gridY && Math.abs((p.gridX * cellWidth) - enemy.x) < 30);

                if (targetPlant) {
                    // Ataca a planta
                    targetPlant.hp -= enemy.damage;
                    // Animação de ataque (tremidinha)
                    enemy.el.style.transform = "scale(1.2)";
                    setTimeout(() => enemy.el.style.transform = "scale(1)", 50);
                } else {
                    // Anda para a esquerda
                    enemy.x -= enemy.speed;
                    enemy.el.style.left = enemy.x + 'px';
                }

                // Condição de Derrota (Inimigo chegou ao final esquerdo)
                if (enemy.x < 0) {
                    gameOver();
                }
            });

            // 2. Ações das Plantas (Gerar sol e Atirar)
            plants.forEach(plant => {
                const now = Date.now();
                if (plant.type === 'sunflower' && now - plant.lastAction > 7000) {
                    // Gera sol perto dela
                    createSunElement((plant.gridX * cellWidth) + 20, (plant.gridY * cellHeight) + 10);
                    plant.lastAction = now;
                }
                if (plant.type === 'peashooter' && now - plant.lastAction > 2000) {
                    // Verifica se há inimigos na mesma linha à frente
                    const hasEnemyInRow = enemies.some(e => e.gridY === plant.gridY && e.x > (plant.gridX * cellWidth));
                    if (hasEnemyInRow) {
                        shootProjectile(plant.gridX, plant.gridY);
                        plant.lastAction = now;
                    }
                }
            });

            // 3. Mover e Checar Projéteis (Sementes ecológicas)
            projectiles.forEach((proj, pIdx) => {
                proj.x += 4;
                proj.el.style.left = proj.x + 'px';

                // Checar colisão com inimigos
                enemies.forEach((enemy, eIdx) => {
                    if (enemy.gridY === proj.gridY && Math.abs(enemy.x - proj.x) < 30) {
                        enemy.hp -= 30; // Dano do tiro
                        proj.el.remove();
                        projectiles.splice(pIdx, 1);

                        // Feedback visual de dano no inimigo
                        enemy.el.style.opacity = 0.5;
                        setTimeout(() => enemy.el.style.opacity = 1, 100);
                    }
                });

                // Remover projétil fora da tela
                if (proj.x > 800 && proj.el.parentNode) {
                    proj.el.remove();
                    projectiles.splice(pIdx, 1);
                }
            });

            // Clean Up: Remover plantas e inimigos mortos
            plants = plants.filter(p => {
                if (p.hp <= 0) { p.el.remove(); return false; }
                return true;
            });

            enemies = enemies.filter(e => {
                if (e.hp <= 0) {
                    e.el.remove();
                    score += 10;
                    updateUI();
                    return false;
                }
                return true;
            });
        }

        function shootProjectile(gridX, gridY) {
            const projEl = document.createElement('div');
            projEl.className = 'projectile';
            projEl.innerText = '🟢'; // Semente biodegradável protetora
            let startX = (gridX * cellWidth) + 40;
            let startY = (gridY * cellHeight) + 25;
            projEl.style.left = startX + 'px';
            projEl.style.top = startY + 'px';
            container.appendChild(projEl);

            projectiles.push({ el: projEl, x: startX, gridY: gridY });
        }

        function gameOver() {
            gameActive = false;
            clearInterval(gameLoopInterval);
            clearInterval(enemySpawnInterval);
            clearInterval(passiveSunInterval);
            document.getElementById('game-over-screen').style.display = 'flex';
        }

        function restartGame() {
            // Limpar tudo do container
            document.querySelectorAll('.entity').forEach(e => e.remove());
            document.querySelectorAll('.projectile').forEach(p => p.remove());
            document.querySelectorAll('.sun-resource').forEach(s => s.remove());

            plants = []; enemies = []; projectiles = [];
            suns = 150; score = 0; gameActive = true;
            document.getElementById('game-over-screen').style.display = 'none';
            updateUI();

            // Reiniciar loops
            initLoops();
        }

        function initLoops() {
            gameLoopInterval = setInterval(gameLoop, 30);
            enemySpawnInterval = setInterval(spawnEnemy, 4000); // Nasce um inimigo a cada 4 segundos
            passiveSunInterval = setInterval(spawnPassiveSun, 5000); // Sol cai do céu a cada 5 segundos
        }

        // Inicializar o Jogo pela primeira vez
        initLoops();
        updateUI();
    </script>
</body>
</html>
